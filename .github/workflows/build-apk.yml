name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android folder if missing
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/pubspec.yaml
            cp -r lib /tmp/lib
            flutter create --platforms=android --project-name pdf_toolkit --org com.kailash.pdftoolkit .
            cp /tmp/pubspec.yaml pubspec.yaml
            rm -rf lib test
            cp -r /tmp/lib lib
          fi

      - name: Configure Android project
        run: |
          sed -i 's/android:label="[^"]*"/android:label="PDF Toolkit"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/flutter\.minSdkVersion/24/' android/app/build.gradle* || true
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g/' android/gradle.properties || true
          rm -rf android/app/src/main/res/mipmap-anydpi* android/app/src/main/res/drawable*/ic_launcher*
          sed -i 's/ android:roundIcon="[^"]*"//' android/app/src/main/AndroidManifest.xml
          cp -r android_res/* android/app/src/main/res/

      - name: Gradle fixes (compileSdk + R8 rules)
        run: |
          mkdir -p ~/.gradle/init.d
          cp gradle_fix/fix.gradle ~/.gradle/init.d/fix.gradle
          cp gradle_fix/mlkit-rules.pro ~/.gradle/mlkit-rules.pro

      - run: flutter pub get
      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-toolkit-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk pdf-toolkit.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pdf-toolkit.apk --title "PDF Toolkit (latest build)" --notes "Direct APK download. Install pdf-toolkit.apk" --target ${{ github.sha }}
