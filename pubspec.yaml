name: pdf_toolkit
description: Offline PDF editor and utility app. All processing happens on the device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <5.0.0"

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_pdf: ">=26.1.35 <40.0.0"
  file_picker: ">=8.0.0 <9.0.0"
  printing: ">=5.10.0 <6.0.0"
  image: ">=4.0.0 <5.0.0"
  image_picker: ">=1.0.0 <2.0.0"
  path_provider: ">=2.1.0 <3.0.0"
  shared_preferences: ">=2.2.0 <3.0.0"
  google_mlkit_text_recognition: ">=0.11.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
